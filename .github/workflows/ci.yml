name: Club Operations System CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sportlfc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete verification
        run: make verify

  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install pinned Streamlit dependencies
        run: |
          python3 -m venv .streamlit-venv
          .streamlit-venv/bin/pip install --disable-pip-version-check -r demo/requirements.txt
          echo "$GITHUB_WORKSPACE/.streamlit-venv/bin" >> "$GITHUB_PATH"

      - name: Run Streamlit verification
        run: make verify-streamlit
