services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: ${SPORTLFC_DB_NAME:-sportlfc}
      MYSQL_USER: ${SPORTLFC_DB_USER:-sportlfc}
      MYSQL_PASSWORD: ${SPORTLFC_DB_PASS:-sportlfcpass}
      MYSQL_ROOT_PASSWORD: ${SPORTLFC_DB_ROOT_PASS:-rootpass}
    volumes:
      - sportlfc_db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: ./web
    environment:
      SPORTLFC_DB_HOST: db
      SPORTLFC_DB_NAME: ${SPORTLFC_DB_NAME:-sportlfc}
      SPORTLFC_DB_USER: ${SPORTLFC_DB_USER:-sportlfc}
      SPORTLFC_DB_PASS: ${SPORTLFC_DB_PASS:-sportlfcpass}
      SPORTLFC_COOKIE_SECURE: ${SPORTLFC_COOKIE_SECURE:-0}
    ports:
      - "${SPORTLFC_WEB_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sportlfc_db_data:
